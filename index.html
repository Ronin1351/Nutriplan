<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Planner & Recipe Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {--bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --bg-tertiary: #e0e0e0;
            --text-primary: #333333;
            --text-secondary: #666666;
            --accent: #4CAF50;
            --accent-hover: #45a049;
            --border: #ddd;
            --shadow: rgba(0, 0, 0, 0.1);
            --danger: #f44336;
            --warning: #ff9800;
            --bg-gradient: linear-gradient(135deg, #ffffff 0%, #f5f5f5 100%);
}

        [data-theme="dark"] {--bg-primary: #1e1e1e;
            --bg-secondary: #2d2d2d;
            --bg-tertiary: #3d3d3d;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --accent: #66bb6a;
            --accent-hover: #81c784;
            --border: #444;
            --shadow: rgba(0, 0, 0, 0.3);
            --danger: #ef5350;
            --warning: #ffb74d;
            --bg-gradient: linear-gradient(135deg, #0f1116 0%, #1e1e1e 100%);
}

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 2px solid var(--border);
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .theme-toggle {
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: 30px;
            padding: 8px;
            cursor: pointer;
            font-size: 1.2em;
            transition: all 0.3s;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border);
            flex-wrap: wrap;
        }

        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }

        .tab:hover {
            color: var(--text-primary);
        }

        .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .recipe-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px var(--shadow);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .recipe-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 12px var(--shadow);
        }

        .recipe-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: var(--bg-tertiary);
        }

        .recipe-image-placeholder {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            opacity: 0.5;
        }

        .recipe-content {
            padding: 20px;
        }

        .recipe-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }

        .recipe-title {
            font-size: 1.3em;
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
        }

        .recipe-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 1.3em;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            color: var(--text-secondary);
        }

        .icon-btn:hover {
            transform: scale(1.2);
            opacity: 0.8;
        }

        .icon-btn.active {
            color: #ff6b6b;
        }

        .icon-btn[title="Delete"]:hover {
            color: var(--danger);
            transform: scale(1.3);
        }

        .recipe-info {
            color: var(--text-secondary);
            margin: 10px 0;
        }

        .recipe-category {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .ingredients-list {
            margin: 15px 0;
            padding-left: 20px;
            max-height: 150px;
            overflow-y: auto;
        }

        .ingredients-list li {
            margin: 5px 0;
            color: var(--text-secondary);
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
            font-weight: 500;
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .btn-danger {
            background: var(--danger);
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.9em;
        }

        .filter-bar {
            display: flex;
            gap: 15px;
            align-items: center;
            padding: 15px;
            background: var(--bg-secondary);
            border-radius: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .category-select {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1em;
            min-width: 150px;
        }

        .pantry-section {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 25px;
        }

        .pantry-form {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 10px;
            margin-bottom: 20px;
        }

        .pantry-form input, .pantry-form select {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1em;
        }

        .pantry-items {
            display: grid;
            gap: 10px;
        }

        .pantry-item {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 10px;
            padding: 15px;
            background: var(--bg-primary);
            border-radius: 8px;
            align-items: center;
        }

        .pantry-item.low-stock {
            border-left: 4px solid var(--warning);
        }

        .meal-planner {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .day-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 20px;
            min-height: 200px;
        }

        .day-card h3 {
            margin-bottom: 15px;
            color: var(--accent);
        }

        .meal-slot {
            background: var(--bg-primary);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .shopping-list {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 25px;
        }

        .shopping-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: var(--bg-primary);
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .shopping-item.in-pantry {
            opacity: 0.6;
            text-decoration: line-through;
        }

        .print-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin: 20px 0;
            font-size: 1em;
        }

        @media print {
            body {
                color: black;
                background: white;
            }
            
            .no-print {
                display: none !important;
            }
            
            .print-only {
                display: block !important;
            }
        }

        .print-only {
            display: none;
        }

        select {
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-primary);
            color: var(--text-primary);
            cursor: pointer;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-primary);
            padding: 30px;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .file-upload-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-upload-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }

        .file-upload-label {
            display: block;
            padding: 10px 20px;
            background: var(--accent);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: background 0.3s;
        }

        .file-upload-label:hover {
            background: var(--accent-hover);
        }

        .image-preview {
            margin-top: 10px;
            max-width: 100%;
            border-radius: 8px;
        }

        .api-recipes {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            padding: 15px;
            background: var(--bg-secondary);
            border-radius: 8px;
            border: 2px solid var(--accent);
        }

        .api-recipe-card {
            background: var(--bg-primary);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .api-recipe-card:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px var(--shadow);
        }

        .api-recipe-card::after {
            content: '+ Add';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(76, 175, 80, 0.95);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .api-recipe-card:hover::after {
            opacity: 1;
        }

        .api-recipe-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .api-recipe-card h4 {
            padding: 10px;
            font-size: 0.9em;
            text-align: center;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            .recipe-grid {
                grid-template-columns: 1fr;
            }
            
            .pantry-form {
                grid-template-columns: 1fr;
            }
            
            .pantry-item {
                grid-template-columns: 1fr;
                text-align: center;
            }
        }

        
        footer {
            display: block;
            width: 100%;
            margin-top: 40px;
            padding: 20px;
            text-align: center;
            background: transparent;
            border-top: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.95em;
            box-shadow: none;
            position: relative;
            z-index: 10;
        }


        
        footer .copyright {
            font-weight: 400;
            color: var(--text-secondary);
            font-size: 0.95em;
            letter-spacing: 0;
            text-transform: none;
            text-shadow: none;
        }

    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🍳 Nutriplan</h1>
            <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
        </header>

        <div class="tabs no-print">
            <button class="tab active" onclick="switchTab('recipes')">📖 Recipes</button>
            <button class="tab" onclick="switchTab('pantry')">🥫 Pantry</button>
            <button class="tab" onclick="switchTab('planner')">📅 Meal Planner</button>
            <button class="tab" onclick="switchTab('shopping')">🛒 Shopping List</button>
        </div>

        <div id="recipes" class="tab-content active">
            <div class="filter-bar">
                <select class="category-select" id="categoryFilter" onchange="filterRecipes()">
                    <option value="">All Categories</option>
                    <option value="Beef">Beef</option>
                    <option value="Breakfast">Breakfast</option>
                    <option value="Chicken">Chicken</option>
                    <option value="Dessert">Dessert</option>
                    <option value="Goat">Goat</option>
                    <option value="Lamb">Lamb</option>
                    <option value="Miscellaneous">Miscellaneous</option>
                    <option value="Pasta">Pasta</option>
                    <option value="Pork">Pork</option>
                    <option value="Seafood">Seafood</option>
                    <option value="Side">Side</option>
                    <option value="Starter">Starter</option>
                    <option value="Vegan">Vegan</option>
                    <option value="Vegetarian">Vegetarian</option>
                </select>
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="favoritesOnly" onchange="filterRecipes()">
                    <label for="favoritesOnly">Show Favorites Only</label>
                </div>
                <button class="btn" onclick="showAddRecipeModal()">+ Add Recipe</button>
                <small style="color: var(--text-secondary); margin-left: 10px;">💡 Select a category to browse online recipes</small>
            </div>
            <div id="apiRecipesContainer"></div>
            <div class="recipe-grid" id="recipeGrid"></div>
        </div>

        <div id="pantry" class="tab-content">
            <div class="pantry-section">
                <h2>My Pantry Inventory</h2>
                <div class="pantry-form">
                    <input type="text" id="pantryItem" placeholder="Item name...">
                    <input type="number" id="pantryAmount" placeholder="Amount">
                    <select id="pantryUnit">
                        <option value="units">units</option>
                        <option value="kg">kg</option>
                        <option value="g">g</option>
                        <option value="L">L</option>
                        <option value="ml">ml</option>
                        <option value="cups">cups</option>
                        <option value="tbsp">tbsp</option>
                        <option value="tsp">tsp</option>
                    </select>
                    <button class="btn" onclick="addPantryItem()">Add</button>
                </div>
                <div class="pantry-items" id="pantryItems"></div>
            </div>
        </div>

        <div id="planner" class="tab-content">
            <h2>Weekly Meal Planner</h2>
            <button class="print-btn no-print" onclick="printMealPlanner()">🖨️ Print Meal Plan</button>
            <div class="meal-planner" id="mealPlanner"></div>
        </div>

        <div id="shopping" class="tab-content">
            <div class="shopping-list">
                <h2>Shopping List</h2>
                <button class="print-btn no-print" onclick="printShoppingList()">🖨️ Print Shopping List</button>
                <div id="shoppingItems"></div>
            </div>
        </div>
    </div>

    <footer class="no-print">
        <div class="copyright">© Kevin Shokrollahi - All Rights Reserved</div>
    </footer>

    <div class="modal" id="addRecipeModal">
        <div class="modal-content">
            <h2 id="modalTitle">Add New Recipe</h2>
            <div class="form-group">
                <label>Recipe Name</label>
                <input type="text" id="newRecipeName">
            </div>
            <div class="form-group">
                <label>Category</label>
                <select id="newRecipeCategory">
                    <option value="Miscellaneous">Miscellaneous</option>
                    <option value="Beef">Beef</option>
                    <option value="Breakfast">Breakfast</option>
                    <option value="Chicken">Chicken</option>
                    <option value="Dessert">Dessert</option>
                    <option value="Goat">Goat</option>
                    <option value="Lamb">Lamb</option>
                    <option value="Pasta">Pasta</option>
                    <option value="Pork">Pork</option>
                    <option value="Seafood">Seafood</option>
                    <option value="Side">Side</option>
                    <option value="Starter">Starter</option>
                    <option value="Vegan">Vegan</option>
                    <option value="Vegetarian">Vegetarian</option>
                </select>
            </div>
            <div class="form-group">
                <label>Photo</label>
                <div class="file-upload-wrapper">
                    <label for="recipePhoto" class="file-upload-label">
                        📷 Choose Photo
                    </label>
                    <input type="file" id="recipePhoto" accept="image/*" onchange="previewImage(event)">
                </div>
                <img id="imagePreview" class="image-preview" style="display: none;">
            </div>
            <div class="form-group">
                <label>Servings</label>
                <input type="number" id="newRecipeServings" value="4">
            </div>
            <div class="form-group">
                <label>Prep Time (minutes)</label>
                <input type="number" id="newRecipePrepTime" value="30">
            </div>
            <div class="form-group">
                <label>Ingredients (one per line with amount)</label>
                <textarea id="newRecipeIngredients" placeholder="2 cups flour&#10;1 tsp salt&#10;3 eggs"></textarea>
            </div>
            <div class="form-group">
                <label>Instructions</label>
                <textarea id="newRecipeInstructions" placeholder="1. Preheat oven to 350°F&#10;2. Mix dry ingredients&#10;3. Add wet ingredients..." rows="6"></textarea>
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button class="btn btn-secondary" onclick="closeAddRecipeModal()">Cancel</button>
                <button class="btn" onclick="saveRecipe()">Save Recipe</button>
            </div>
        </div>
    </div>

    <script>
        // Initialize data
        let recipes = [
            {
                id: 1,
                name: "Spaghetti Carbonara",
                category: "Pasta",
                servings: 4,
                prepTime: 20,
                isFavorite: true,
                image: null,
                ingredients: [
                    { item: "spaghetti", amount: 400, unit: "g" },
                    { item: "eggs", amount: 4, unit: "units" },
                    { item: "bacon", amount: 200, unit: "g" },
                    { item: "parmesan cheese", amount: 100, unit: "g" },
                    { item: "black pepper", amount: 1, unit: "tsp" }
                ],
                instructions: "1. Cook spaghetti according to package directions\n2. Fry bacon until crispy\n3. Beat eggs with parmesan\n4. Toss hot pasta with bacon and egg mixture\n5. Season with black pepper"
            },
            {
                id: 2,
                name: "Chicken Stir Fry",
                category: "Chicken",
                servings: 4,
                prepTime: 25,
                isFavorite: false,
                image: null,
                ingredients: [
                    { item: "chicken breast", amount: 500, unit: "g" },
                    { item: "mixed vegetables", amount: 300, unit: "g" },
                    { item: "soy sauce", amount: 3, unit: "tbsp" },
                    { item: "garlic", amount: 3, unit: "units" },
                    { item: "ginger", amount: 1, unit: "tbsp" },
                    { item: "rice", amount: 2, unit: "cups" }
                ],
                instructions: "1. Cook rice according to package directions\n2. Cut chicken into bite-sized pieces\n3. Stir-fry chicken until cooked\n4. Add vegetables and seasonings\n5. Serve over rice"
            },
            {
                id: 3,
                name: "Greek Salad",
                category: "Vegetarian",
                servings: 2,
                prepTime: 15,
                isFavorite: true,
                image: null,
                ingredients: [
                    { item: "cucumber", amount: 1, unit: "units" },
                    { item: "tomatoes", amount: 3, unit: "units" },
                    { item: "red onion", amount: 0.5, unit: "units" },
                    { item: "feta cheese", amount: 150, unit: "g" },
                    { item: "olives", amount: 100, unit: "g" },
                    { item: "olive oil", amount: 3, unit: "tbsp" }
                ],
                instructions: "1. Chop all vegetables\n2. Combine in a bowl\n3. Add feta and olives\n4. Drizzle with olive oil\n5. Season with salt and oregano"
            }
        ];

        let pantry = [
            { item: "spaghetti", amount: 200, unit: "g" },
            { item: "eggs", amount: 6, unit: "units" },
            { item: "olive oil", amount: 500, unit: "ml" },
            { item: "rice", amount: 1, unit: "kg" }
        ];

        let mealPlan = {
            Monday: [],
            Tuesday: [],
            Wednesday: [],
            Thursday: [],
            Friday: [],
            Saturday: [],
            Sunday: []
        };

        let editingRecipeId = null;

        // Theme toggle
        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', newTheme);
            
            const themeBtn = document.querySelector('.theme-toggle');
            themeBtn.textContent = newTheme === 'dark' ? '☀️' : '🌙';
            
            localStorage.setItem('theme', newTheme);
        }

        // Initialize theme
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.body.setAttribute('data-theme', savedTheme);
        document.querySelector('.theme-toggle').textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        // Tab switching
        function switchTab(tabName) {
            const tabs = document.querySelectorAll('.tab');
            const contents = document.querySelectorAll('.tab-content');
            
            tabs.forEach(tab => tab.classList.remove('active'));
            contents.forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
            
            if (tabName === 'shopping') {
                updateShoppingList();
            }
        }

        // Recipe management
        function renderRecipes() {
            const grid = document.getElementById('recipeGrid');
            const favoritesOnly = document.getElementById('favoritesOnly').checked;
            const categoryFilter = document.getElementById('categoryFilter').value;
            
            let filteredRecipes = recipes;
            
            if (favoritesOnly) {
                filteredRecipes = filteredRecipes.filter(r => r.isFavorite);
            }
            
            if (categoryFilter) {
                filteredRecipes = filteredRecipes.filter(r => r.category === categoryFilter);
            }
            
            grid.innerHTML = filteredRecipes.map(recipe => `
                <div class="recipe-card">
                    ${recipe.image ? 
                        `<img src="${recipe.image}" alt="${recipe.name}" class="recipe-image">` :
                        `<div class="recipe-image-placeholder">🍽️</div>`
                    }
                    <div class="recipe-content">
                        <div class="recipe-header">
                            <div class="recipe-title">${recipe.name}</div>
                            <div class="recipe-actions">
                                <button class="icon-btn ${recipe.isFavorite ? 'active' : ''}" 
                                        onclick="toggleFavorite(${recipe.id})" title="Favorite">
                                    ${recipe.isFavorite ? '❤️' : '🤍'}
                                </button>
                                <button class="icon-btn" onclick="editRecipe(${recipe.id})" title="Edit">
                                    ✏️
                                </button>
                                <button class="icon-btn" onclick="printRecipe(${recipe.id})" title="Print">
                                    🖨️
                                </button>
                                <button class="icon-btn" onclick="deleteRecipe(${recipe.id})" title="Delete" style="color: var(--danger);">
                                    🗑️
                                </button>
                            </div>
                        </div>
                        <div class="recipe-category">${recipe.category}</div>
                        <div class="recipe-info">
                            <div>👥 Servings: ${recipe.servings}</div>
                            <div>⏱️ Prep Time: ${recipe.prepTime} mins</div>
                        </div>
                        <ul class="ingredients-list">
                            ${recipe.ingredients.map(ing => 
                                `<li>${ing.amount} ${ing.unit} ${ing.item}</li>`
                            ).join('')}
                        </ul>
                        <button class="btn btn-small" onclick="addToMealPlan(${recipe.id})">
                            Add to Meal Plan
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function toggleFavorite(recipeId) {
            const recipe = recipes.find(r => r.id === recipeId);
            if (recipe) {
                recipe.isFavorite = !recipe.isFavorite;
                renderRecipes();
            }
        }

        function filterRecipes() {
            renderRecipes();
            // Automatically fetch online recipes when a category is selected
            const categoryFilter = document.getElementById('categoryFilter').value;
            if (categoryFilter) {
                fetchApiRecipes();
            } else {
                // Clear online recipes if "All Categories" is selected
                document.getElementById('apiRecipesContainer').innerHTML = '';
            }
        }

        function showAddRecipeModal() {
            document.getElementById('modalTitle').textContent = 'Add New Recipe';
            editingRecipeId = null;
            clearRecipeForm();
            document.getElementById('addRecipeModal').classList.add('active');
        }

        function editRecipe(recipeId) {
            const recipe = recipes.find(r => r.id === recipeId);
            if (recipe) {
                editingRecipeId = recipeId;
                document.getElementById('modalTitle').textContent = 'Edit Recipe';
                document.getElementById('newRecipeName').value = recipe.name;
                document.getElementById('newRecipeCategory').value = recipe.category;
                document.getElementById('newRecipeServings').value = recipe.servings;
                document.getElementById('newRecipePrepTime').value = recipe.prepTime;
                document.getElementById('newRecipeIngredients').value = recipe.ingredients
                    .map(ing => `${ing.amount} ${ing.unit} ${ing.item}`).join('\n');
                document.getElementById('newRecipeInstructions').value = recipe.instructions || '';
                
                if (recipe.image) {
                    document.getElementById('imagePreview').src = recipe.image;
                    document.getElementById('imagePreview').style.display = 'block';
                }
                
                document.getElementById('addRecipeModal').classList.add('active');
            }
        }

        function clearRecipeForm() {
            document.getElementById('newRecipeName').value = '';
            document.getElementById('newRecipeCategory').value = 'Miscellaneous';
            document.getElementById('newRecipeServings').value = '4';
            document.getElementById('newRecipePrepTime').value = '30';
            document.getElementById('newRecipeIngredients').value = '';
            document.getElementById('newRecipeInstructions').value = '';
            document.getElementById('recipePhoto').value = '';
            document.getElementById('imagePreview').style.display = 'none';
        }

        function closeAddRecipeModal() {
            document.getElementById('addRecipeModal').classList.remove('active');
            clearRecipeForm();
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('imagePreview').src = e.target.result;
                    document.getElementById('imagePreview').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function saveRecipe() {
            const name = document.getElementById('newRecipeName').value;
            const category = document.getElementById('newRecipeCategory').value;
            const servings = parseInt(document.getElementById('newRecipeServings').value);
            const prepTime = parseInt(document.getElementById('newRecipePrepTime').value);
            const ingredientsText = document.getElementById('newRecipeIngredients').value;
            const instructions = document.getElementById('newRecipeInstructions').value;
            const imagePreview = document.getElementById('imagePreview');
            const image = imagePreview.style.display !== 'none' ? imagePreview.src : null;
            
            if (!name || !ingredientsText) {
                alert('Please fill in recipe name and ingredients');
                return;
            }
            
            const ingredients = ingredientsText.split('\n')
                .filter(line => line.trim())
                .map(line => {
                    const parts = line.trim().split(' ');
                    const amount = parseFloat(parts[0]) || 1;
                    const unit = parts[1] || 'units';
                    const item = parts.slice(2).join(' ') || parts.slice(1).join(' ');
                    return { item, amount, unit };
                });
            
            if (editingRecipeId) {
                const recipe = recipes.find(r => r.id === editingRecipeId);
                if (recipe) {
                    recipe.name = name;
                    recipe.category = category;
                    recipe.servings = servings;
                    recipe.prepTime = prepTime;
                    recipe.ingredients = ingredients;
                    recipe.instructions = instructions;
                    recipe.image = image;
                }
            } else {
                const newRecipe = {
                    id: recipes.length + 1,
                    name,
                    category,
                    servings,
                    prepTime,
                    isFavorite: false,
                    ingredients,
                    instructions,
                    image
                };
                recipes.push(newRecipe);
            }
            
            renderRecipes();
            closeAddRecipeModal();
        }

        function printRecipe(recipeId) {
            const recipe = recipes.find(r => r.id === recipeId);
            if (recipe) {
                const printWindow = window.open('', '', 'width=800,height=600');
                printWindow.document.write(`
                    <html>
                    <head>
                        <title>${recipe.name}</title>
                        <style>
                            body { font-family: Arial, sans-serif; padding: 20px; }
                            h1 { color: #4CAF50; }
                            .info { margin: 20px 0; }
                            .section { margin: 20px 0; }
                            ul { padding-left: 20px; }
                            img { max-width: 300px; margin: 20px 0; }
                        </style>
                    </head>
                    <body>
                        <h1>${recipe.name}</h1>
                        ${recipe.image ? `<img src="${recipe.image}" alt="${recipe.name}">` : ''}
                        <div class="info">
                            <p><strong>Category:</strong> ${recipe.category}</p>
                            <p><strong>Servings:</strong> ${recipe.servings}</p>
                            <p><strong>Prep Time:</strong> ${recipe.prepTime} minutes</p>
                        </div>
                        <div class="section">
                            <h2>Ingredients</h2>
                            <ul>
                                ${recipe.ingredients.map(ing => 
                                    `<li>${ing.amount} ${ing.unit} ${ing.item}</li>`
                                ).join('')}
                            </ul>
                        </div>
                        <div class="section">
                            <h2>Instructions</h2>
                            <p style="white-space: pre-line">${recipe.instructions || 'No instructions provided'}</p>
                        </div>
                    </body>
                    </html>
                `);
                printWindow.document.close();
                printWindow.print();
            }
        }

        function deleteRecipe(recipeId) {
            if (confirm('Are you sure you want to delete this recipe?')) {
                // Remove from recipes array
                recipes = recipes.filter(r => r.id !== recipeId);
                
                // Remove from meal plans
                Object.keys(mealPlan).forEach(day => {
                    mealPlan[day] = mealPlan[day].filter(id => id !== recipeId);
                });
                
                renderRecipes();
                renderMealPlanner();
            }
        }

        // TheMealDB API integration
        async function fetchApiRecipes() {
            const container = document.getElementById('apiRecipesContainer');
            const category = document.getElementById('categoryFilter').value;
            
            // Don't fetch if no category is selected
            if (!category) {
                container.innerHTML = '';
                return;
            }
            
            container.innerHTML = '<div class="loading">Loading recipes from TheMealDB...</div>';
            
            try {
                const response = await fetch(`https://www.themealdb.com/api/json/v1/1/filter.php?c=${category}`);
                const data = await response.json();
                
                if (data.meals) {
                    container.innerHTML = `
                        <h3>📡 Online Recipes - ${category}</h3>
                        <div class="api-recipes">
                            ${data.meals.slice(0, 12).map(meal => `
                                <div class="api-recipe-card" onclick="fetchRecipeDetails('${meal.idMeal}')" title="Click to add to your recipes">
                                    <img src="${meal.strMealThumb}" alt="${meal.strMeal}">
                                    <h4>${meal.strMeal}</h4>
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else {
                    container.innerHTML = '<div class="loading">No online recipes found for this category</div>';
                }
            } catch (error) {
                container.innerHTML = '<div class="loading">Unable to load online recipes. Please check your connection.</div>';
            }
        }

        async function fetchRecipeDetails(mealId) {
            try {
                const response = await fetch(`https://www.themealdb.com/api/json/v1/1/lookup.php?i=${mealId}`);
                const data = await response.json();
                
                if (data.meals && data.meals[0]) {
                    const meal = data.meals[0];
                    const ingredients = [];
                    
                    for (let i = 1; i <= 20; i++) {
                        const ingredient = meal[`strIngredient${i}`];
                        const measure = meal[`strMeasure${i}`];
                        if (ingredient && ingredient.trim()) {
                            ingredients.push({
                                item: ingredient,
                                amount: parseFloat(measure) || 1,
                                unit: measure.replace(/[0-9]/g, '').trim() || 'units'
                            });
                        }
                    }
                    
                    const newRecipe = {
                        id: recipes.length + 1,
                        name: meal.strMeal,
                        category: meal.strCategory,
                        servings: 4,
                        prepTime: 30,
                        isFavorite: false,
                        ingredients: ingredients,
                        instructions: meal.strInstructions,
                        image: meal.strMealThumb
                    };
                    
                    recipes.push(newRecipe);
                    renderRecipes();
                    document.getElementById('apiRecipesContainer').innerHTML = '';
                    alert(`"${meal.strMeal}" has been added to your recipes!`);
                }
            } catch (error) {
                alert('Failed to fetch recipe details');
            }
        }

        // Pantry management
        function renderPantry() {
            const container = document.getElementById('pantryItems');
            container.innerHTML = pantry.map((item, index) => `
                <div class="pantry-item ${item.amount < 100 && item.unit === 'g' ? 'low-stock' : ''}">
                    <div>${item.item}</div>
                    <div>${item.amount}</div>
                    <div>${item.unit}</div>
                    <button class="btn btn-danger" onclick="removePantryItem(${index})">Remove</button>
                </div>
            `).join('');
        }

        function addPantryItem() {
            const item = document.getElementById('pantryItem').value;
            const amount = parseFloat(document.getElementById('pantryAmount').value);
            const unit = document.getElementById('pantryUnit').value;
            
            if (!item || !amount) {
                alert('Please fill in all fields');
                return;
            }
            
            const existing = pantry.find(p => p.item === item);
            if (existing) {
                existing.amount += amount;
            } else {
                pantry.push({ item, amount, unit });
            }
            
            document.getElementById('pantryItem').value = '';
            document.getElementById('pantryAmount').value = '';
            
            renderPantry();
        }

        function removePantryItem(index) {
            pantry.splice(index, 1);
            renderPantry();
        }

        // Meal planner
        function renderMealPlanner() {
            const container = document.getElementById('mealPlanner');
            const days = Object.keys(mealPlan);
            
            container.innerHTML = days.map(day => `
                <div class="day-card">
                    <h3>${day}</h3>
                    <select onchange="addMealToDay('${day}', this.value)" style="width: 100%; margin-bottom: 10px;">
                        <option value="">Add meal...</option>
                        ${recipes.map(r => `<option value="${r.id}">${r.name}</option>`).join('')}
                    </select>
                    <div id="${day}-meals">
                        ${mealPlan[day].map((mealId, index) => {
                            const recipe = recipes.find(r => r.id === mealId);
                            return recipe ? `
                                <div class="meal-slot">
                                    <span>${recipe.name}</span>
                                    <button onclick="removeMealFromDay('${day}', ${index})" style="background: none; border: none; cursor: pointer;">❌</button>
                                </div>
                            ` : '';
                        }).join('')}
                    </div>
                </div>
            `).join('');
        }

        function addToMealPlan(recipeId) {
            const days = Object.keys(mealPlan);
            const day = prompt(`Add to which day? (${days.join(', ')})`);
            
            if (day && mealPlan[day] !== undefined) {
                mealPlan[day].push(recipeId);
                renderMealPlanner();
                alert('Added to ' + day + '!');
            }
        }

        function addMealToDay(day, recipeId) {
            if (recipeId) {
                mealPlan[day].push(parseInt(recipeId));
                renderMealPlanner();
            }
        }

        function removeMealFromDay(day, index) {
            mealPlan[day].splice(index, 1);
            renderMealPlanner();
        }

        // Shopping list
        function updateShoppingList() {
            const container = document.getElementById('shoppingItems');
            const neededItems = {};
            
            // Calculate needed items from meal plan
            Object.values(mealPlan).flat().forEach(recipeId => {
                const recipe = recipes.find(r => r.id === recipeId);
                if (recipe) {
                    recipe.ingredients.forEach(ing => {
                        if (!neededItems[ing.item]) {
                            neededItems[ing.item] = { amount: 0, unit: ing.unit };
                        }
                        neededItems[ing.item].amount += ing.amount;
                    });
                }
            });
            
            // Check against pantry
            const shoppingList = Object.entries(neededItems).map(([item, needed]) => {
                const inPantry = pantry.find(p => p.item === item);
                const pantryAmount = inPantry ? inPantry.amount : 0;
                const toBuy = Math.max(0, needed.amount - pantryAmount);
                
                return {
                    item,
                    needed: needed.amount,
                    have: pantryAmount,
                    toBuy,
                    unit: needed.unit,
                    sufficient: toBuy === 0
                };
            });
            
            container.innerHTML = shoppingList.map(item => `
                <div class="shopping-item ${item.sufficient ? 'in-pantry' : ''}">
                    <div>
                        <strong>${item.item}</strong>
                        <div style="font-size: 0.9em; color: var(--text-secondary);">
                            Need: ${item.needed} ${item.unit} | Have: ${item.have} ${item.unit}
                        </div>
                    </div>
                    <div>
                        ${item.toBuy > 0 ? `Buy: ${item.toBuy} ${item.unit}` : '✓ In Pantry'}
                    </div>
                </div>
            `).join('');
        }

        // Print functions
        function printMealPlanner() {
            const printContent = document.getElementById('mealPlanner').innerHTML;
            const originalContent = document.body.innerHTML;
            
            document.body.innerHTML = `
                <h1>Weekly Meal Plan</h1>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;">
                    ${printContent}
                </div>
            `;
            
            window.print();
            document.body.innerHTML = originalContent;
            location.reload();
        }

        function printShoppingList() {
            const printContent = document.getElementById('shoppingItems').innerHTML;
            const originalContent = document.body.innerHTML;
            
            document.body.innerHTML = `
                <h1>Shopping List</h1>
                <div>${printContent}</div>
            `;
            
            window.print();
            document.body.innerHTML = originalContent;
            location.reload();
        }

        // Initialize the app
        renderRecipes();
        renderPantry();
        renderMealPlanner();
    </script>
</body>
</html>
